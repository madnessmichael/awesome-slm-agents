name: Link reachability report
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-reachability
          path: reports/link-check.json
